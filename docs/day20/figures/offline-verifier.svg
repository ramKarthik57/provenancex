<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad6" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <marker id="arrow6" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="url(#bgGrad6)"/>
  
  <text x="450" y="35" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#0f172a">Standalone Air-Gapped Verification Pipeline</text>
  <text x="450" y="55" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#64748b">In the Tested Verifier Configuration: Zero Network Sockets, Zero Database Connections</text>

  <g transform="translate(50, 120)">
    <rect x="0" y="0" width="140" height="90" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="70" y="28" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#0f172a">1. Bundle Archive</text>
    <text x="70" y="50" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle" fill="#64748b">Extracts tar.gz</text>
    <text x="70" y="68" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle" fill="#64748b">Validates manifest</text>

    <line x1="140" y1="45" x2="180" y2="45" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow6)"/>

    <rect x="180" y="0" width="140" height="90" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="70" y="28" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#0f172a">2. Digest Match</text>
    <text x="70" y="50" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle" fill="#64748b">SHA-256 on app.bin</text>
    <text x="70" y="68" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle" fill="#64748b">Matches manifest</text>

    <line x1="320" y1="45" x2="360" y2="45" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow6)"/>

    <rect x="360" y="0" width="140" height="90" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="70" y="28" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#0f172a">3. Signatures</text>
    <text x="70" y="50" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle" fill="#64748b">Ed25519 / ECDSA</text>
    <text x="70" y="68" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle" fill="#64748b">Stdlib crypto math</text>

    <line x1="500" y1="45" x2="540" y2="45" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow6)"/>

    <rect x="540" y="0" width="140" height="90" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="70" y="28" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#0f172a">4. Attestation</text>
    <text x="70" y="50" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle" fill="#64748b">SLSA v1.0 predicate</text>
    <text x="70" y="68" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle" fill="#64748b">Matches subject</text>

    <line x1="680" y1="45" x2="720" y2="45" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow6)"/>

    <rect x="720" y="0" width="110" height="90" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
    <text x="55" y="40" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#15803d">VERDICT</text>
    <text x="55" y="62" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#166534">TRUSTED</text>
  </g>

  <g transform="translate(150, 280)">
    <rect x="0" y="0" width="600" height="140" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
    <text x="300" y="32" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0369a1">Tested Verifier Properties &amp; Air-Gap Conformance</text>
    
    <text x="30" y="65" font-family="system-ui, sans-serif" font-size="12" fill="#334155">✓ Zero Network Sockets: Operates with complete physical network interface disconnection</text>
    <text x="30" y="90" font-family="system-ui, sans-serif" font-size="12" fill="#334155">✓ Zero Database Connections: Requires no external Postgres, Redis, or Rekor servers</text>
    <text x="30" y="115" font-family="system-ui, sans-serif" font-size="12" fill="#334155">✓ Standalone Go Binary: Deploys as a self-contained release gate filter (~12 MB)</text>
  </g>
</svg>