<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="shadow2" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#bgGrad2)"/>
  
  <text x="450" y="35" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#0f172a">The Twelve-Layer Evidence Model &amp; Epistemic Triad</text>
  <text x="450" y="55" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#64748b">Partitioning Reality: Direct Observations, Derived Computations, and External Assertions</text>

  <g transform="translate(180, 75)">
    <rect x="0" y="0" width="150" height="25" rx="4" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="75" y="17" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#0369a1">Direct Observations</text>
    
    <rect x="190" y="0" width="150" height="25" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="265" y="17" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#15803d">Derived Evidence</text>
    
    <rect x="380" y="0" width="150" height="25" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="455" y="17" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#b45309">External Assertions</text>
  </g>

  <g transform="translate(60, 120)">
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="370" height="65" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" filter="url(#shadow2)"/>
      <text x="15" y="25" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#b45309">L1: Source Repository (Git)</text>
      <text x="15" y="48" font-family="system-ui, sans-serif" font-size="11" fill="#475569">Commit hash, tree hash, author identity, working tree cleanliness</text>
    </g>
    <g transform="translate(0, 80)">
      <rect x="0" y="0" width="370" height="65" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" filter="url(#shadow2)"/>
      <text x="15" y="25" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#b45309">L2: Declared Dependencies</text>
      <text x="15" y="48" font-family="system-ui, sans-serif" font-size="11" fill="#475569">Package manifests (go.mod, package.json, requirements.txt)</text>
    </g>
    <g transform="translate(0, 160)">
      <rect x="0" y="0" width="370" height="65" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" filter="url(#shadow2)"/>
      <text x="15" y="25" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#15803d">L3: Lockfile Resolution</text>
      <text x="15" y="48" font-family="system-ui, sans-serif" font-size="11" fill="#475569">Pinned package versions &amp; cryptographic integrity hashes</text>
    </g>
    <g transform="translate(0, 240)">
      <rect x="0" y="0" width="370" height="65" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" filter="url(#shadow2)"/>
      <text x="15" y="25" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#b45309">L4: Software Bill of Materials</text>
      <text x="15" y="48" font-family="system-ui, sans-serif" font-size="11" fill="#475569">CycloneDX v1.5 / SPDX v2.3 component inventories &amp; licenses</text>
    </g>
    <g transform="translate(0, 320)">
      <rect x="0" y="0" width="370" height="65" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5" filter="url(#shadow2)"/>
      <text x="15" y="25" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#0369a1">L5: Environment Fingerprint</text>
      <text x="15" y="48" font-family="system-ui, sans-serif" font-size="11" fill="#475569">Host OS, kernel build, CPU arch, compiler toolchain path</text>
    </g>
    <g transform="translate(0, 400)">
      <rect x="0" y="0" width="370" height="65" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5" filter="url(#shadow2)"/>
      <text x="15" y="25" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#0369a1">L6: Build Execution Process</text>
      <text x="15" y="48" font-family="system-ui, sans-serif" font-size="11" fill="#475569">Primary build command, flags, exit status, execution duration</text>
    </g>

    <g transform="translate(410, 0)">
      <rect x="0" y="0" width="370" height="65" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5" filter="url(#shadow2)"/>
      <text x="15" y="25" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#0369a1">L7: Process Hierarchy (ETW)</text>
      <text x="15" y="48" font-family="system-ui, sans-serif" font-size="11" fill="#475569">Complete process tree, child PIDs, helper toolchains</text>
    </g>
    <g transform="translate(410, 80)">
      <rect x="0" y="0" width="370" height="65" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5" filter="url(#shadow2)"/>
      <text x="15" y="25" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#0369a1">L8: Filesystem Mutations</text>
      <text x="15" y="48" font-family="system-ui, sans-serif" font-size="11" fill="#475569">Files created/modified/deleted, writer PID attribution</text>
    </g>
    <g transform="translate(410, 160)">
      <rect x="0" y="0" width="370" height="65" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5" filter="url(#shadow2)"/>
      <text x="15" y="25" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#0369a1">L9: Network Connections</text>
      <text x="15" y="48" font-family="system-ui, sans-serif" font-size="11" fill="#475569">Destination IPs, ports, TCP/UDP sockets, DNS query entropy</text>
    </g>
    <g transform="translate(410, 240)">
      <rect x="0" y="0" width="370" height="65" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" filter="url(#shadow2)"/>
      <text x="15" y="25" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#15803d">L10: Target Artifacts</text>
      <text x="15" y="48" font-family="system-ui, sans-serif" font-size="11" fill="#475569">Release binaries, libraries, SHA-256 bitwise digests</text>
    </g>
    <g transform="translate(410, 320)">
      <rect x="0" y="0" width="370" height="65" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" filter="url(#shadow2)"/>
      <text x="15" y="25" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#b45309">L11: Attestations &amp; Lineage</text>
      <text x="15" y="48" font-family="system-ui, sans-serif" font-size="11" fill="#475569">SLSA Provenance v1.0, in-toto link predicates, materials</text>
    </g>
    <g transform="translate(410, 400)">
      <rect x="0" y="0" width="370" height="65" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" filter="url(#shadow2)"/>
      <text x="15" y="25" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#15803d">L12: Cryptographic Signatures</text>
      <text x="15" y="48" font-family="system-ui, sans-serif" font-size="11" fill="#475569">Ed25519/ECDSA/RSA signatures, public verification keys</text>
    </g>
  </g>
</svg>