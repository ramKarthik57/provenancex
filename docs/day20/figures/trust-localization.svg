<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <marker id="arrow4" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="url(#bgGrad4)"/>
  
  <text x="450" y="35" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#0f172a">Topological Earliest Trust-Break Localization (L*)</text>
  <text x="450" y="55" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#64748b">Isolating the Earliest Inconsistent Layer in the Evidence DAG (100% in Evaluated Scenarios)</text>

  <g transform="translate(60, 120)">
    <rect x="0" y="20" width="90" height="50" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="45" y="45" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#15803d">L1: Repo</text>
    <text x="45" y="60" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle" fill="#166534">VALID</text>

    <line x1="90" y1="45" x2="120" y2="45" stroke="#64748b" stroke-width="2" marker-end="url(#arrow4)"/>

    <rect x="120" y="20" width="90" height="50" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="165" y="45" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#15803d">L2: Deps</text>
    <text x="165" y="60" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle" fill="#166534">VALID</text>

    <line x1="210" y1="45" x2="240" y2="45" stroke="#64748b" stroke-width="2" marker-end="url(#arrow4)"/>

    <rect x="240" y="20" width="90" height="50" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="285" y="45" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#15803d">L3: Lock</text>
    <text x="285" y="60" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle" fill="#166534">VALID</text>

    <line x1="330" y1="45" x2="360" y2="45" stroke="#64748b" stroke-width="2" marker-end="url(#arrow4)"/>

    <rect x="360" y="20" width="100" height="50" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/>
    <text x="410" y="45" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#b91c1c">L7: Process</text>
    <text x="410" y="60" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#991b1b">L* BROKEN</text>

    <path d="M 410 0 L 410 15" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow4)"/>
    <text x="410" y="-8" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#dc2626">EARLIEST BREAK (L*)</text>

    <line x1="460" y1="45" x2="490" y2="45" stroke="#64748b" stroke-width="2" marker-end="url(#arrow4)"/>

    <rect x="490" y="20" width="90" height="50" rx="6" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
    <text x="535" y="45" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#854d0e">L8: FS</text>
    <text x="535" y="60" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle" fill="#854d0e">Cascade</text>

    <line x1="580" y1="45" x2="610" y2="45" stroke="#64748b" stroke-width="2" marker-end="url(#arrow4)"/>

    <rect x="610" y="20" width="90" height="50" rx="6" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
    <text x="655" y="45" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#854d0e">L10: Binary</text>
    <text x="655" y="60" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle" fill="#854d0e">Cascade</text>

    <line x1="700" y1="45" x2="730" y2="45" stroke="#64748b" stroke-width="2" marker-end="url(#arrow4)"/>

    <rect x="730" y="20" width="90" height="50" rx="6" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
    <text x="775" y="45" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#854d0e">L12: Sig</text>
    <text x="775" y="60" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle" fill="#854d0e">Cascade</text>
  </g>

  <g transform="translate(100, 240)">
    <rect x="0" y="0" width="700" height="150" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="350" y="32" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0f172a">Algorithmic Formulation &amp; Causal Clarification</text>
    
    <text x="30" y="65" font-family="system-ui, sans-serif" font-size="12" fill="#334155">• Let Pi = [L_pi1, L_pi2, ..., L_pi12] be the topological sort of DAG G computed via Kahn's algorithm.</text>
    <text x="30" y="90" font-family="system-ui, sans-serif" font-size="12" fill="#334155">• Formula: L* = argmin_{L_k in Pi} { k | EvidenceState(L_k) = CONTRADICTED }.</text>
    
    <rect x="30" y="105" width="640" height="30" rx="4" fill="#eff6ff"/>
    <text x="350" y="125" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#1d4ed8">Note: ProvenanceX identifies the earliest observable inconsistent layer rather than claiming to identify the attacker's true physical origin.</text>
  </g>
</svg>